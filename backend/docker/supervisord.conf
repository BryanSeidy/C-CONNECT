; ==============================================================================
; C-Connect API — Supervisor Configuration (Production Container)
; ==============================================================================
; Orchestre PHP-FPM et Nginx dans un seul container.
; Supervisor s'assure que les deux processus restent vivants et les redémarre
; automatiquement en cas de crash.
; ==============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/var/run/supervisord.pid
loglevel=warn

; ---------------------------------------------------------------------------
; PHP-FPM — Backend PHP
; ---------------------------------------------------------------------------
[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---------------------------------------------------------------------------
; Nginx — Reverse proxy HTTP
; ---------------------------------------------------------------------------
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---------------------------------------------------------------------------
; Laravel Queue Worker (optionnel — décommenter si queue != sync)
; ---------------------------------------------------------------------------
; [program:laravel-queue]
; process_name=%(program_name)s_%(process_num)02d
; command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
; autostart=true
; autorestart=true
; stopasgroup=true
; killasgroup=true
; numprocs=2
; user=www-data
; redirect_stderr=true
; stdout_logfile=/var/log/supervisor/queue-worker.log
; stopwaitsecs=3600

; ---------------------------------------------------------------------------
; Laravel Scheduler (optionnel — décommenter si des tâches planifiées existent)
; ---------------------------------------------------------------------------
; [program:laravel-scheduler]
; command=/bin/sh -c "while true; do php /var/www/html/artisan schedule:run --no-interaction >> /dev/null 2>&1; sleep 60; done"
; autostart=true
; autorestart=true
; user=www-data
; redirect_stderr=true
; stdout_logfile=/var/log/supervisor/scheduler.log
