# ==============================================================================
# C-Connect API — Nginx Configuration (Production Container)
# ==============================================================================
# Sert l'application Laravel derrière PHP-FPM dans le même container.
# Supervisord orchestre Nginx + PHP-FPM ensemble.
# ==============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # -------------------------------------------------------------------------
    # Logs
    # -------------------------------------------------------------------------
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # -------------------------------------------------------------------------
    # Taille maximale des uploads (produits marketplace, avatars, etc.)
    # -------------------------------------------------------------------------
    client_max_body_size 64M;

    # -------------------------------------------------------------------------
    # Gestion des requêtes statiques et du front controller Laravel
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # -------------------------------------------------------------------------
    # PHP-FPM — Proxy vers le socket TCP local
    # -------------------------------------------------------------------------
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Timeouts adaptés aux opérations longues (migrations, imports, etc.)
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_connect_timeout 60;

        # Buffer size pour éviter les "upstream sent too big header"
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    # -------------------------------------------------------------------------
    # Bloquer l'accès aux fichiers cachés (.env, .git, .htaccess, etc.)
    # -------------------------------------------------------------------------
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # -------------------------------------------------------------------------
    # Cache des assets statiques
    # -------------------------------------------------------------------------
    location ~* \.(css|js|gif|ico|jpg|jpeg|png|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Santé du container (utilisé par Docker HEALTHCHECK / Kubernetes probes)
    # -------------------------------------------------------------------------
    location = /up {
        try_files $uri /index.php?$query_string;
    }

    # Bloquer l'accès à favicon.ico et robots.txt pour éviter les logs inutiles
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # -------------------------------------------------------------------------
    # Sécurité : en-têtes de réponse
    # -------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
