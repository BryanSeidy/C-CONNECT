; ==============================================================================
; C-Connect — PHP Configuration (Production)
; ==============================================================================

; Limites mémoire raisonnables pour la production
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 60

; Sécurité : ne JAMAIS afficher les erreurs en production
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On
error_log = /var/log/php/error.log

; ---------------------------------------------------------------------------
; OPcache — Configuration optimisée pour la production
; ---------------------------------------------------------------------------
; Les scripts PHP sont pré-compilés en bytecode et cachés en mémoire.
; Critique pour les performances sur un hébergement mutualisé ou container.
; ---------------------------------------------------------------------------
opcache.enable = 1
opcache.enable_cli = 1
; Nombre de fichiers PHP à cacher (Laravel + vendors ≈ 15-20k fichiers)
opcache.max_accelerated_files = 20000
; Mémoire allouée au cache (128 Mo couvre largement un projet Laravel)
opcache.memory_consumption = 128
; Mémoire pour les strings internées
opcache.interned_strings_buffer = 16
; Ne PAS vérifier les timestamps en prod (les fichiers ne changent pas)
opcache.validate_timestamps = 0
; Précharger tout le framework au démarrage de PHP-FPM
opcache.preload_user = www-data
; Sauvegarder le cache entre les redémarrages
opcache.save_comments = 1
opcache.fast_shutdown = 1

; Timezone
date.timezone = Africa/Douala

; Sécurité
expose_php = Off
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
