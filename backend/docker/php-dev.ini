; ==============================================================================
; C-Connect — PHP Configuration (Développement Local)
; ==============================================================================

; Limites mémoire (généreux pour le dev)
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300

; Affichage des erreurs (dev uniquement)
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; OPcache désactivé en dev pour le hot-reloading
opcache.enable = 0

; Timezone
date.timezone = Africa/Douala

; Extensions PostgreSQL — vérification chargement
; (pdo_pgsql et pgsql sont compilés dans l'image Docker)
